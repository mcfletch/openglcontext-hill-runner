name: tests

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
  # `release.yml` runs this on every push to main and then decides whether the
  # version is worth publishing, so main is covered from there rather than by a
  # `push:` trigger here -- which would run the whole matrix twice per push.
  workflow_call:

jobs:
  test:
    name: ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PyOpenGL finds the GL and GLU libraries through ctypes at import time,
      # so they have to exist even for the tests that never open a context.
      - name: Install the GL shared libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa

      # `--pre` because most of the stack (PyOpenGL 4.0.0a, PyVRML97 2.3.4b,
      # simpleparse 3.0.0a, TTFQuery 2.0.1a) carries pre-release versions, which
      # pip skips by default. Every dependency resolves from PyPI.
      - name: Install the game
        run: |
          python -m pip install --upgrade pip
          python -m pip install --pre -e ".[test]"

      # No display on the runner, so the render smoke test skips itself and what
      # runs is the headless half: the course, the runner's body, collisions,
      # the autopilot over generated courses, the scenery meshes and the cues.
      - name: Run the suite
        run: python -m pytest -q

  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.12 rather than the 3.10 floor: numpy's stubs use 3.12 type syntax,
          # matching `python_version` under [tool.mypy].
          python-version: "3.12"

      - name: Install the game and its tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --pre -e ".[dev]"

      # Both are configured in pyproject.toml and a merge waits on them.
      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy src/openglcontext_hill_runner

  install:
    name: sdist installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # PyOpenGL finds the GL and GLU libraries through ctypes at import time,
      # so they have to exist even for the tests that never open a context.
      - name: Install the GL shared libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa

      # `requires-python = ">=3.10"` is a claim about installing rather than
      # about the test matrix, so it is checked where a user meets it.
      - name: Build and install the sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
          python -m pip install --pre dist/*.tar.gz
      - name: Import it from somewhere that is not the checkout
        run: cd /tmp && python -c "import openglcontext_hill_runner as m; print(m.__version__)"
