[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openglcontext-hill-runner"
# Read from src/openglcontext_hill_runner/__init__.py, the one definition; see
# [tool.setuptools.dynamic].
dynamic = ["version"]
description = "An endless downhill runner for OpenGLContext: parallel paths, streamed generated tiles, shadows, sound and a skinned runner."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "ASSET-LICENSES.md"]
authors = [{ name = "Mike C. Fletcher", email = "vrplumber@gmail.com" }]
keywords = ["OpenGLContext", "OpenGL", "game", "runner", "PBR", "demo", "3D"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = [
    "OpenGLContext[audio]>=3.0.0a5",
    "opengl_extrusions>=1.2.1a1",
    "numpy>=2.0",
    "PyOpenGL>=4.0.0a1",
    "glfw>=2.5",
]

[project.optional-dependencies]
# The forest demo's trees and ground cover, which the game plants where the art is installed.
forest = ["openglcontext-forest-demo"]
test = ["pytest>=7", "pytest-timeout", "pillow"]
dev = ["openglcontext-hill-runner[test]", "ruff", "mypy"]

[project.scripts]
oglc-hill-runner = "openglcontext_hill_runner.run:main"

[tool.setuptools.dynamic]
version = { attr = "openglcontext_hill_runner.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The art is a content pack fetched on the first run (content.py), not part of the wheel.
openglcontext_hill_runner = ["packs.json"]

[tool.openglcontext-checks]
select = ["OGC101", "OGC102", "OGC111", "OGC121", "OGC131", "OGC141", "OGC201", "OGC221", "OGC222", "OGC223"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP", "BLE", "S110", "PGH003", "PGH004", "RUF100", "RUF012", "ARG", "S112", "E722", "TRY400", "DTZ"]
ignore = [
    "E501",   # line length is kept readable by hand
    "E741",   # x/y/z read naturally as coordinates
    "UP031",  # percent formatting, as the engine uses
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p OpenGLContext.testing.plugin"
timeout = 300
markers = [
    "needs_gl: opens a real GL window; skipped where there is no display",
]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/openglcontext_hill_runner/__init__.py" }]
